spring:
  application:
    name: payment-service

  datasource:
    # Variables injected by Docker Compose from Vault (secret/payment/db).
    # Keys: username, password, dbname, host, port — exact match with Vault path.
    # Fail-fast on startup if any variable is absent (Spring Boot enforces :?).
    url: jdbc:postgresql://${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required}/${DB_NAME:?DB_NAME is required}
    username: ${DB_USERNAME:?DB_USERNAME is required}
    password: ${DB_PASSWORD:?DB_PASSWORD is required}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 5

  jpa:
    # Flyway owns schema — ddl-auto must never be create or update.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

jwt:
  # HS256 signing secret used to VALIDATE tokens issued by identity-service.
  # Must be the exact same value as identity-service's own JWT_SIGNING_KEY
  # (shared HS256 secret — see JwtService javadoc). Env var ONLY — no
  # default, no Vault client in this service. Fails startup if absent, same
  # :? pattern as the DB_* variables above.
  signing-key: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}

cors:
  # Browser origins allowed to call this API (see CorsConfig). Not a secret —
  # a sensible default is fine here, unlike JWT_SIGNING_KEY/DB_* above.
  # Comma-separated list, overridable per environment via CORS_ALLOWED_ORIGINS.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://admin.localhost}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always