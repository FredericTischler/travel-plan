spring:
  application:
    name: travel-service

  neo4j:
    # Variables injected by Docker Compose from Vault (secret/travel/db).
    # Keys: username, password, host, port — exact match with Vault path.
    # No "dbname": Neo4j Community Edition has a single default database.
    # Fail-fast on startup if any variable is absent (Spring Boot enforces :?).
    uri: bolt://${NEO4J_HOST:?NEO4J_HOST is required}:${NEO4J_PORT:?NEO4J_PORT is required}
    authentication:
      # Neo4j Community Edition: single admin account (username "neo4j"), no
      # per-service scoped account possible — see Neo4jConnectionConfig javadoc.
      username: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}
      password: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always