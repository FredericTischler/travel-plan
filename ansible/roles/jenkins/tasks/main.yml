---
# roles/jenkins/tasks/main.yml
#
# Modele operatoire identique a postgres/vault/neo4j/traefik : Ansible
# PROVISIONNE et REND des fichiers ; docker-compose ORCHESTRE. Aucun
# docker_container, aucun `docker compose up` declenche depuis ce role.
#
# CE QUE CE ROLE REND (increment CI/CD n°2 : generalisation multi-jobs) :
#   1. compose.jenkins.yml  -> fragment de service Compose (profil `ci`)
#   2. job-<nom>-config.xml -> UNE definition de job Pipeline PAR ENTREE de
#      `jenkins_jobs`, PRETE A POSTER (3 aujourd'hui : identity/payment/travel)
#
# CE QUE CE ROLE NE FAIT PAS (assume, pas un oubli) :
#   - Il ne CREE pas les jobs dans Jenkins : cela exigerait de s'authentifier
#     (mot de passe admin / token API) => un SECRET cote Ansible, avant que
#     Vault ne soit cable a Jenkins. Contrat du projet : on s'arrete et on le
#     signale plutot que d'inliner un credential. La creation est une commande
#     CLI documentee (README), jouee par l'operateur avec le mot de passe
#     genere a l'execution par Jenkins.
#   - Il n'installe pas les plugins : meme raison (API authentifiee).
#
# IDEMPOTENCE par construction : uniquement assert / getent (modules de FAITS,
# jamais `changed`) / set_fact / file / template. Aucun command:, aucun shell:.
# Un 2e converge rapporte changed=0.

# --------------------------------------------------------------------------
# 1) Garde fail-fast : le miroir SCM local est un CHEMIN ABSOLU d'hote, il n'a
#    pas de defaut raisonnable. Mieux vaut echouer ici, en clair, que rendre un
#    fragment avec un bind-mount vide que Compose refuserait plus tard.
# --------------------------------------------------------------------------
- name: "Assert the local SCM mirror path is provided (absolute host path)"
  ansible.builtin.assert:
    that:
      - jenkins_scm_repo_host_path | length > 0
      - jenkins_scm_repo_host_path is match('^/')
    fail_msg: >-
      jenkins_scm_repo_host_path est vide ou non absolu. Ce role monte un MIROIR
      LOCAL du depot en lecture seule dans Jenkins (le remote est en SSH : un
      clone direct exigerait une cle de deploiement, donc un secret, ce que cet
      increment refuse). Fournir :
      -e jenkins_scm_repo_host_path=/chemin/absolu/vers/le/checkout/travel-plan
    success_msg: "Miroir SCM local : {{ jenkins_scm_repo_host_path }}"
  tags: [compose_fragment]

# --------------------------------------------------------------------------
# 2) GID du groupe `docker` de l'hote.
#    Le process jenkins tourne en uid 1000 SANS le groupe docker : sans
#    `group_add`, tout acces au socket renvoie EACCES et Testcontainers echoue.
#    `getent` est un module de FAITS -> jamais `changed` (idempotence preservee).
#    fail_key: false pour que l'absence du groupe (ex : plateforme Molecule)
#    n'explose pas ici : on la rattrape par une assertion parlante juste apres.
# --------------------------------------------------------------------------
- name: "Look up the host docker group GID (only when not pinned explicitly)"
  ansible.builtin.getent:
    database: group
    key: docker
    fail_key: false
  when: jenkins_docker_gid | string | length == 0
  tags: [compose_fragment]

- name: "Resolve the docker GID from the explicit variable (pinned wins)"
  ansible.builtin.set_fact:
    jenkins_docker_gid_resolved: "{{ jenkins_docker_gid | string }}"
  when: jenkins_docker_gid | string | length > 0
  tags: [compose_fragment]

# `default([], true)` (2e argument = true) rattrape AUSSI une valeur falsy :
# avec fail_key: false, un groupe absent donne `docker: null`, pas une cle
# indefinie. Sur liste vide, l'index [1] rend Undefined -> default('') -> ''
# -> l'assertion suivante echoue avec un message parlant.
- name: "Resolve the docker GID from the host group database (auto-discovery)"
  ansible.builtin.set_fact:
    jenkins_docker_gid_resolved: >-
      {{ ((ansible_facts.getent_group | default({}, true))['docker']
          | default([], true))[1] | default('') }}
  when: jenkins_docker_gid | string | length == 0
  tags: [compose_fragment]

- name: "Assert a docker GID was resolved (socket write access is mandatory)"
  ansible.builtin.assert:
    that:
      - jenkins_docker_gid_resolved | length > 0
    fail_msg: >-
      Impossible de resoudre le GID du groupe `docker` sur cet hote et
      jenkins_docker_gid n'est pas fourni. Sans lui, le conteneur Jenkins
      (uid 1000) ne peut pas ecrire sur {{ jenkins_docker_socket }} et les tests
      Testcontainers des 3 services echouent en EACCES.
      Fournir : -e jenkins_docker_gid=$(getent group docker | cut -d: -f3)
    success_msg: "GID docker retenu : {{ jenkins_docker_gid_resolved }}"
  tags: [compose_fragment]

# --------------------------------------------------------------------------
# 3) Repertoire de rendu + fragment de service Compose (templating pur)
# --------------------------------------------------------------------------
- name: "Ensure compose fragment directory exists"
  ansible.builtin.file:
    path: "{{ jenkins_compose_dir }}"
    state: directory
    mode: "0755"
  tags: [compose_fragment]

- name: "Render Jenkins compose service fragment"
  ansible.builtin.template:
    src: "compose.jenkins.yml.j2"
    dest: "{{ jenkins_compose_dir }}/compose.jenkins.yml"
    mode: "0644"
  tags: [compose_fragment]

# --------------------------------------------------------------------------
# 4) Definitions des jobs Pipeline (config.xml), rendues PRETES A POSTER.
#    Aucun secret dedans : SCM en file:// sans credential, aucun trigger.
#
#    Garde fail-fast AVANT la boucle : une entree incomplete de `jenkins_jobs`
#    ne casserait pas le rendu (Jinja rendrait la chaine vide pour la cle
#    manquante) — elle produirait un config.xml SYNTAXIQUEMENT VALIDE mais
#    silencieusement faux (job sans scriptPath => "Build Now" echoue seulement
#    au moment du build, loin d'ici). On prefere echouer au provisioning.
#    `assert` est un module de verification : jamais `changed`, idempotence
#    preservee.
# --------------------------------------------------------------------------
- name: "Assert every jenkins_jobs entry is complete (name/description/script_path)"
  ansible.builtin.assert:
    that:
      - jenkins_jobs | length > 0
      - jenkins_jobs | rejectattr('name', 'defined') | list | length == 0
      - jenkins_jobs | rejectattr('description', 'defined') | list | length == 0
      - jenkins_jobs | rejectattr('script_path', 'defined') | list | length == 0
      # Noms uniques : deux entrees homonymes s'ecraseraient mutuellement au
      # rendu (meme dest) et se marcheraient dessus au createItem.
      - (jenkins_jobs | map(attribute='name') | list | unique | length)
        == (jenkins_jobs | length)
    fail_msg: >-
      jenkins_jobs est vide, incomplet ou contient des noms dupliques. Chaque
      entree doit porter name / description / script_path (cf. defaults).
    success_msg: >-
      {{ jenkins_jobs | length }} job(s) a rendre :
      {{ jenkins_jobs | map(attribute='name') | join(', ') }}
  tags: [job_definition]

# UN SEUL template generique pour les 3 jobs : le <triggers/> vide et l'absence
# de credential n'existent qu'a UN endroit, donc aucun job ne peut deriver sans
# que les 3 derivent (et Molecule asserte les 3).
# `label:` pour que la sortie affiche le nom du job et pas le dict entier.
- name: "Render each Pipeline job definition (config.xml, one per service)"
  ansible.builtin.template:
    src: "job-pipeline.xml.j2"
    dest: "{{ jenkins_compose_dir }}/job-{{ job.name }}-config.xml"
    mode: "0644"
  loop: "{{ jenkins_jobs }}"
  loop_control:
    loop_var: job
    label: "{{ job.name }}"
  tags: [job_definition]
